<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Private Equity Portfolio Value Creation Lakehouse - Executive Covenant Monitoring & Financial Mart Portal">
  <title>Aethelgard Capital | Portfolio Value Creation & Covenant Lakehouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      /* Bespoke Warm Linen & Forest Green Design System */
      --bg-canvas: #F7F5F0;
      --bg-card: #FFFFFF;
      --bg-surface: #FAF8F5;
      --bg-subtle: #F0EDE6;
      --border-stone: #E5E0D8;
      --border-stone-strong: #D4CDC3;
      
      /* Typography */
      --text-pine: #1B2E26;
      --text-stone: #6B665E;
      --text-muted: #8C867D;
      --text-subtle: #A8A29A;
      
      /* Primary Accents */
      --pine-primary: #234E3E;
      --pine-hover: #18372C;
      --pine-light: #EBF2EE;
      --sage-accent: #3D7058;
      --sage-light: #F0F6F2;
      
      /* Status & Alerts */
      --terracotta-alert: #9E2A2B;
      --terracotta-bg: #FBF0F0;
      --amber-warn: #B87333;
      --amber-bg: #FCF6ED;
      
      /* Font Families */
      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Shadows & Radii */
      --shadow-sm: 0 1px 2px rgba(27, 46, 38, 0.04);
      --shadow-card: 0 2px 8px rgba(27, 46, 38, 0.04), 0 1px 3px rgba(27, 46, 38, 0.02);
      --shadow-dropdown: 0 12px 32px rgba(27, 46, 38, 0.1), 0 4px 12px rgba(27, 46, 38, 0.05);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--text-pine);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Editorial Linen Background Texture */
    .linen-texture {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.25;
      background-image: radial-gradient(#6B665E 0.5px, transparent 0.5px);
      background-size: 12px 12px;
      z-index: 0;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 2rem 4rem 2rem;
      width: 100%;
    }

    /* Editorial Card System */
    .editorial-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-stone);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .editorial-card:hover {
      border-color: var(--border-stone-strong);
    }
  </style>
</head>
<body>
  <div class="linen-texture"></div>
  <div class="app-container" id="root-app">
    <!-- Application scaffolding -->
  </div>
  <script src="data.js"></script>
</body>
</html>
