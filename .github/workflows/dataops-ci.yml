name: DataOps & Financial Integrity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Financial DataOps Quality Gate
  # ─────────────────────────────────────────────────────────────
  dataops-quality-gate:
    name: Financial DataOps Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Multi-ERP Portfolio Ledger
        run: |
          python scripts/generate_portfolio_data.py

      - name: Run End-to-End Medallion Lakehouse Pipeline
        run: |
          python run_pipeline.py --all

      - name: Execute PyTest Financial Governance Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Verify Lakehouse Parquet and Audit Artifacts
        run: |
          python -c "
          import os, glob

          # ── Exact file assertions ──────────────────────────────────────────────
          required_exact = [
              'data/01_raw/raw_general_ledger_entries.csv',
              'data/01_raw/raw_coa_crosswalk_mapping.csv',
              'data/01_raw/raw_fx_rates_monthly.csv',
              'data/01_raw/raw_debt_covenants_master.csv',
              'data/02_silver/silver_general_ledger_harmonized.parquet',
              'data/02_silver/silver_debt_covenants.parquet',
              'data/03_gold/fact_financial_monthly.parquet',
              'data/03_gold/fact_covenant_health.parquet',
              'data/03_gold/feat_portfolio_covenant_health.parquet',
              'data/03_gold/dim_entity.parquet',
              'data/03_gold/dim_period.parquet',
              'data/03_gold/dim_account.parquet',
              'data/03_gold/powerbi_portfolio_value_creation.csv',
              'data/03_gold/audit_variance_anomalies.csv',
              'reports/lineage_variance_gate_report.json',
          ]
          for artifact in required_exact:
              assert os.path.exists(artifact), f'MISSING: {artifact}'
              size = os.path.getsize(artifact)
              assert size > 0, f'ZERO-BYTE artifact: {artifact}'
              print(f'[OK] {artifact} ({size:,} bytes)')

          # ── Partitioned Silver Parquet (entity_code= directories) ─────────────
          entities = ['DURA_US', 'MED_UK', 'LOGI_EU', 'RETAIL_US']
          for entity in entities:
              pattern = f'data/02_silver/prm_harmonized_financial_ledger.parquet/entity_code={entity}/*.parquet'
              matches = glob.glob(pattern)
              assert len(matches) >= 1, f'MISSING partitioned Parquet for entity {entity}'
              print(f'[OK] Partitioned Silver: entity_code={entity} ({len(matches)} file(s))')

          print()
          print('All Medallion Lakehouse artefacts verified successfully.')
          "

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Vercel Production Deployment (runs AFTER gate passes)
  # Only runs on push to main (not on PRs)
  # ─────────────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy Executive Dashboard to Vercel
    runs-on: ubuntu-latest
    needs: dataops-quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://pe-portfolio-fabric-lakehouse.vercel.app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment & Project Metadata
        run: |
          vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOY_URL"

      - name: Verify Deployment Health
        run: |
          sleep 10
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            "${{ steps.deploy.outputs.deploy_url }}")
          echo "Dashboard HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Deployment health check failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Deployment health check passed."
