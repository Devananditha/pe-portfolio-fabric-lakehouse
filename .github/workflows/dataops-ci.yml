name: DataOps & Financial Integrity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dataops-quality-gate:
    name: Financial DataOps Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Multi-ERP Portfolio Ledger
        run: |
          python scripts/generate_portfolio_data.py

      - name: Execute PyTest Financial Governance Suite
        run: |
          pytest tests/ -v

      - name: Run End-to-End Medallion Lakehouse Pipeline
        run: |
          python run_pipeline.py --all

      - name: Verify Lakehouse Parquet and Audit Artifacts
        run: |
          python -c "
          import os
          required_artifacts = [
              'data/01_raw/raw_general_ledger_entries.csv',
              'data/02_silver/fact_harmonized_ledger.parquet',
              'data/03_gold/agg_portfolio_monthly_pl.parquet',
              'data/03_gold/agg_portfolio_debt_facilities.parquet',
              'data/03_gold/feat_portfolio_covenant_health.parquet',
              'data/03_gold/powerbi_portfolio_value_creation.csv',
              'data/03_gold/audit_variance_anomalies.csv',
              'reports/lineage_variance_gate_report.json'
          ]
          for artifact in required_artifacts:
              assert os.path.exists(artifact), f'Missing required artifact: {artifact}'
              print(f'Verified artifact exists: {artifact}')
          print('All Medallion lakehouse artifacts verified successfully.')
          "
