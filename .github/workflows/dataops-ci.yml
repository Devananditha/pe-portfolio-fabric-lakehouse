name: DataOps & Financial Integrity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dataops-quality-gate:
    name: Financial DataOps Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Multi-ERP Portfolio Ledger
        run: |
          python scripts/generate_portfolio_data.py

      - name: Execute PyTest Financial Governance Suite
        run: |
          pytest tests/ -v
